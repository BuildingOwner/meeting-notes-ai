services:
  nginx:
    image: nginx:alpine
    ports:
      # LAN HTTPS: 0.0.0.0:38443 → nginx:443 → web:3000(/) + api:8088(/api/*)
      - "0.0.0.0:38443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/certs:ro
    restart: unless-stopped
    depends_on:
      - api
      - web

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: meeting-notes-ai/api:latest
    ports:
      # 호스트 loopback 만 — Claude Code (host) 가 plain HTTP MCP 로 접근.
      - "127.0.0.1:38080:8088"
    volumes:
      - ${HOME}/meeting-notes:/data
    environment:
      MEETING_NOTES_ROOT: /data
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8088
      NOTION_DEFAULT_TARGET_ID: ${NOTION_DEFAULT_TARGET_ID:-}
      NOTION_DEFAULT_TARGET_KIND: ${NOTION_DEFAULT_TARGET_KIND:-database}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: meeting-notes-ai/web:latest
    ports:
      - "127.0.0.1:33000:3000"
    restart: unless-stopped
    depends_on:
      - api

  stt:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.stt
    image: meeting-notes-ai/stt:latest
    volumes:
      - ${HOME}/meeting-notes:/data
      # 호스트의 faster-whisper 모델을 컨테이너 /models로 마운트.
      # 필요시 STT_MODEL_DIR_HOST 환경변수로 경로 변경.
      - ${STT_MODEL_DIR_HOST:-/home/hipo1/models/whisper}:/models:ro
    environment:
      MEETING_NOTES_ROOT: /data
      STT_MODEL_PATH: /models/faster-whisper-large-v3-turbo
      STT_DEVICE: cuda
      STT_GPU_INDEX: ${STT_GPU_INDEX:-0}
      STT_COMPUTE_TYPE: float16
      STT_LANGUAGE: ko
      STT_IDLE_UNLOAD: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${STT_GPU_INDEX:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - api

# Note: bridge daemon is intentionally NOT in compose.
# It needs tmux send-keys access to the host's tmux server (meeting-notes-cc session),
# which is awkward to expose into a container. Run on host:
#   uv run python -m workers.bridge.bridge
